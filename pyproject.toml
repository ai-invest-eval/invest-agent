[project]
name = "invest-agent"
version = "0.1.0"
description = "AI drug discovery startup investment evaluation agents"
readme = "README.md"
requires-python = "==3.11.11"
dependencies = [
    "langchain==1.0.2",
    "langchain-openai==1.0.1",
    "langchain-tavily==0.2.12",
    "langgraph==1.0.9",
    "markdown>=3.11",
    "openai==2.6.1",
    "pydantic==2.12.3",
    "python-dotenv==1.2.1",
    "tavily-python==0.7.12",
    "weasyprint>=70.0",
]

[project.optional-dependencies]
rag = [
    "faiss-cpu>=1.15.1",
    "fonttools>=4.66.1",
    "kiwipiepy>=0.24.0",
    "pypdf>=6.19.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "pytest>=9.1.1",
    "ruff==0.16.9",
]
